apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matrix-app
  template:
    metadata:
      labels:
        app: matrix-app
    spec:
      containers:
        - name: matrix-app
          image: cheshiroriginal/matrix-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5