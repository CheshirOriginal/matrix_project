apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-app
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: matrix-app

  template:
    metadata:
      labels:
        app: matrix-app

    spec:
      containers:
        - name: matrix-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
