name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x cicd/*.sh

      - name: Build project
        run: bash cicd/build.sh

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: matrix-binary
          path: matrix_app

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: matrix-binary

      - name: Make executable
        run: chmod +x matrix_app

      - name: Run tests
        run: bash cicd/test.sh

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install dpkg tools
        run: sudo apt update && sudo apt install -y dpkg-dev

      - name: Extract version (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build deb package
        run: bash cicd/package.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: matrix-deb-package
          path: matrix-app_*.deb

  docker-test:
    runs-on: ubuntu-latest
    needs: package

    steps:
      - uses: actions/checkout@v4

      - name: Download deb
        uses: actions/download-artifact@v4
        with:
          name: matrix-deb-package

      - name: Build Docker image
        run: docker build -t matrix-app:test .

      - name: Run container test
        run: |
          docker run -d -p 8080:8080 --name matrix-test matrix-app:test
          sleep 3
          curl -X POST localhost:8080/process \
          -d "3
          1 2 3
          4 5 6
          7 8 9"
          docker stop matrix-test

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/matrix-app:${{ env.VERSION }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/matrix-app:${{ env.VERSION }} \
                     ${{ secrets.DOCKERHUB_USERNAME }}/matrix-app:latest

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/matrix-app:${{ env.VERSION }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/matrix-app:latest